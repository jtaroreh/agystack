name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install Python dependencies
        run: |
          uv sync --python "${{ matrix.python-version }}" --frozen --extra test

      - name: Run Python linter
        run: |
          uv run ruff check .

      - name: Run shell script checks
        run: |
          bash -n scripts/package-plugin.sh skills/poteto-mode/scripts/worktree-audit.sh skills/show-me-your-work/scripts/log.sh
          shellcheck -S warning scripts/package-plugin.sh skills/poteto-mode/scripts/worktree-audit.sh skills/show-me-your-work/scripts/log.sh

      - name: Run setup runtime doctor
        run: |
          uv run python skills/setup-agystack/scripts/setup_runtime.py --doctor

      - name: Run pytest test suite
        run: |
          uv run pytest -v --timeout=60 tests/

      - name: Install script dependencies
        working-directory: skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile

      - name: Typecheck TypeScript tools
        working-directory: skills/poteto-mode/scripts
        run: |
          bun run typecheck

      - name: Run TypeScript unit tests
        working-directory: skills/poteto-mode/scripts
        run: |
          bun test

      - name: Verify plugin packaging archive
        run: |
          pkg_dir="$RUNNER_TEMP/pkg-test"
          rm -rf "$pkg_dir"
          bash scripts/package-plugin.sh --output-dir "$pkg_dir"
          archive=$(find "$pkg_dir" -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$archive"
          unzip -t "$archive" >/dev/null
          python3 - "$archive" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile(sys.argv[1]) as zf:
              if zf.testzip() is not None:
                  raise SystemExit("Corrupt zip entry detected")
              names = set(zf.namelist())

          required = {
              "plugin.json",
              "README.md",
              "LICENSE",
              "agystack-models.md",
              "agystack-runtime.json.example",
              "hooks.json.example",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing required root assets: {missing}")

          forbidden = [
              name for name in sorted(names)
              if name.endswith(".test.ts")
              or name.endswith(".test-helper.ts")
              or "__pycache__" in Path(name).parts
              or "node_modules" in Path(name).parts
          ]
          if forbidden:
              raise SystemExit(f"Forbidden entries in archive: {forbidden[:10]}")
          PY
