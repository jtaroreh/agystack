[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[project]
name = "agystack"
version = "0.16.0"
description = "Rigorous agentic engineering and poteto workflow plugin for Google Antigravity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["skills"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    "scratch",
    ".slices",
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "skills/poteto-mode/scripts/node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501", "E722"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"skills/poteto-mode/scripts/*" = ["ALL"]

